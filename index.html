<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generate Kode Akses</title>
<link rel="icon" href="data:," />

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; margin: 0 0 20px; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #6366f1;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .code-box {
    margin-top: 20px;
    padding: 16px;
    background: #0f172a;
    border: 1px dashed #6366f1;
    border-radius: 10px;
    text-align: center;
    font-size: 22px;
    letter-spacing: 2px;
    font-weight: 700;
    display: none;
  }
  .warn {
    margin-top: 12px;
    font-size: 12px;
    color: #94a3b8;
    text-align: center;
    display: none;
  }
  .copy-btn {
    margin-top: 10px;
    background: #334155;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔑 Generator Kode Akses</h1>
    <button id="genBtn">Generate Kode Baru</button>
    <div class="code-box" id="codeBox"></div>
    <button class="copy-btn" id="copyBtn">📋 Salin Kode</button>
    <div class="warn" id="warn">⚠️ Kode ini cuma tampil sekali. Catat/simpan sekarang sebelum tutup halaman.</div>
  </div>

<script>
const genBtn = document.getElementById('genBtn');
const codeBox = document.getElementById('codeBox');
const copyBtn = document.getElementById('copyBtn');
const warn = document.getElementById('warn');

async function generate() {
  genBtn.disabled = true;
  genBtn.textContent = 'Generating...';
  try {
    const res = await fetch('/api/generate', { method: 'POST' });
    const data = await res.json();
    if (data.code) {
      codeBox.style.display = 'block';
      codeBox.textContent = data.code;
      copyBtn.style.display = 'block';
      warn.style.display = 'block';
    } else {
      alert('Gagal generate: ' + data.error);
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
  genBtn.disabled = false;
  genBtn.textContent = 'Generate Kode Baru';
}

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(codeBox.textContent);
  copyBtn.textContent = '✅ Tersalin!';
  setTimeout(() => (copyBtn.textContent = '📋 Salin Kode'), 1500);
});

genBtn.addEventListener('click', generate);
</script>
</body>
</html>
